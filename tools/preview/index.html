<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Предпросмотр</title>
<link rel="stylesheet" href="../../src/ui/styles.css">
</head><body>
<!-- Предпросмотр вёрстки без базы: подменяем клиента Supabase готовым состоянием.
     Открывается локально, в приложение не входит. -->
<div id="root"></div>
<div id="login-screen" style="display:none;"></div>
<script>
  window.APP_CONFIG = { env: 'dev', url: '', key: '' };
</script>
<script type="module">
  const state = await (await fetch('./state.json')).json();
  // ?empty=1 — пустой план: так видно подсказки первого входа
  if (new URLSearchParams(location.search).has('empty')) {
    state.income = { plan_years: [], payout_slots: [], periods: [], salary_rates: [], tax_scales: [], tax_brackets: [],
      vacations: [], sick_leaves: [], extra_incomes: [], income_history: [], account_calendar_days: [], working_day_overrides: [] };
    state.expenses = { expense_categories: [], expense_items: [], expense_period_overrides: [] };
    state.savings = { goals: [], goal_milestones: [], goal_transactions: [], goal_cycles: [], goal_cycle_skips: [], savings_period_overrides: [] };
    state.debts = { credit_cards: [], credit_card_ops: [], credit_payment_overrides: [], installments: [], installment_payments: [] };
    state.gifts = { gift_events: [], gift_event_amounts: [] };
    state.facts = { expense_facts: [] };
  }
  window.supabase = {
    createClient: () => ({
      auth: {
        getSession: async () => ({ data: { session: { user: { id: 'u' } } } }),
        getUser: async () => ({ data: { user: { email: 'demo@example.com' } } }),
        signOut: async () => {},
      },
      rpc: async (name) => {
        if (name === 'bootstrap_user' || name === 'state_get') return { data: state, error: null };
        return { data: { tables: {} }, error: null };
      },
    }),
  };
  await import('../../src/main.js');
</script>
</body></html>
